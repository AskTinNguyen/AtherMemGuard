# Ather MemGuard doctor catalogue: what common apps are, and whether Unreal work needs them.
#
# Embedded in the program. People extend or override it in settings.toml:
#   [doctor]
#   keep = ["SomeTool"]            # never proposed
#   close = ["SomeGame*"]          # treated as "not needed for Unreal"
#   close_while_unreal = ["Spotify"]
#
# Each [[app]] is one app, which may run several processes. Fields:
#   name         what people call it
#   verdict      close       not needed for Unreal work; closing it is safe and frees memory
#                hold_back   wanted, but shouldn't compete with Unreal: put it in a MemGuard group
#                keep        part of Unreal work or the system; never proposed
#                review      known, but whether it's needed depends on the person: shown, not proposed
#                heavy_tool  a big creative or virtualisation tool that is probably deliberate
#   category     a few words, shown in the checkup
#   processes    executable names without .exe; a trailing * is a wildcard; case doesn't matter
#   description  one line, second person: what it is and why Unreal doesn't need it
#   group        hold_back only: the MemGuard group it belongs in
#   family       true for a family of separate apps: each is shown on its own, by exe name
#
# Be conservative: when unsure, use review rather than close. Exact names win over
# wildcards, and longer wildcards over shorter ones.

