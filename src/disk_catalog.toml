# What the disk checkup looks for, and the cleanup's allow-list: Ather MemGuard only ever
# cleans these folders, at these places, after the person (or an agent, for regenerable
# items) picks them from a plan.
#
# class: regenerable  Unreal or the tool rebuilds it          default action: now (delete)
#        disposable   not rebuilt, but not needed               default action: bin
#        rebuild_cost rebuilt, but it takes long (hours of shader or cook work)   default: bin
#        review       your call (lanes, worktrees, the git LFS store, VHDXs): never auto-cleaned
# tool:  the tool's own clean command is offered too (permanent, "can't be undone").
# Zen (ue:zen) is never deleted file by file: use Zen's own garbage collection.
#
# [[project]] paths are relative to a recognised root (.uproject, Engine\Build\Build.version, .git, Cargo.toml).
# [[global]] paths start with an environment variable.

[[project]]
key = "ue:intermediate"
class = "regenerable"
title = "Build files (Intermediate)"
path = 'Intermediate'

[[project]]
key = "ue:plugin_intermediate"
class = "regenerable"
title = "Plugin build files"
plugins = true
path = 'Intermediate'

[[project]]
key = "ue:ddc"
class = "regenerable"
title = "Project cache (DDC)"
path = 'DerivedDataCache'

[[project]]
key = "ue:plugin_ddc"
class = "regenerable"
title = "Plugin cache (DDC)"
plugins = true
path = 'DerivedDataCache'

[[project]]
key = "ue:crashes"
class = "regenerable"
title = "Crash reports"
path = 'Saved\Crashes'

[[project]]
key = "ue:shader_debug"
class = "regenerable"
title = "Shader debug files"
path = 'Saved\ShaderDebugInfo'

[[project]]
key = "ue:logs"
class = "disposable"
title = "Logs"
path = 'Saved\Logs'

[[project]]
key = "ue:profiling"
class = "disposable"
title = "Profiling captures"
path = 'Saved\Profiling'

[[project]]
key = "ue:video_captures"
class = "disposable"
title = "Video captures"
path = 'Saved\VideoCaptures'

[[project]]
key = "ue:cooked"
class = "rebuild_cost"
title = "Cooked content"
path = 'Saved\Cooked'

[[project]]
key = "ue:staged"
class = "rebuild_cost"
title = "Staged builds"
path = 'Saved\StagedBuilds'

[[project]]
key = "ue:archived_builds"
class = "rebuild_cost"
title = "Archived builds"
path = 'Saved\ArchivedBuilds'

[[project]]
key = "ue:pdb"
class = "review"
title = "Debug symbols (PDB)"
path = 'Binaries\Win64'
glob = "*.pdb"
older_than_days = 7

[[project]]
key = "vs:ipch"
class = "regenerable"
title = "Visual Studio IntelliSense PCH (ipch)"
path = '.vs\...\ipch'

[[project]]
key = "rust:target"
class = "regenerable"
title = "Rust build files (target)"
path = 'target'
marker = "Cargo.toml"
older_than_days = 7

[[project]]
key = "git:lfs"
class = "review"
title = "Git LFS store"
path = '.git\lfs\objects'
tool = "git-lfs"
diagnostic = true

[[project]]
key = "git:loose_objects"
class = "review"
title = "Git loose objects"
path = '.git\objects'
tool = "git-maintenance"
diagnostic = true

[[project]]
key = "git:packs"
class = "review"
title = "Git packfiles"
path = '.git\objects\pack'
tool = "git-repack"
diagnostic = true

[[project]]
key = "git:tmp_packs"
class = "review"
title = "Stale Git temp packs"
path = '.git\objects\pack'
tool = "git-prune-tmp"
diagnostic = true

[[project]]
key = "git:reflogs"
class = "review"
title = "Git reflogs"
path = '.git\logs'
tool = "git-reflog"
diagnostic = true

[[project]]
key = "git:worktrees"
class = "review"
title = "Stale Git worktrees"
path = '.git\worktrees'
tool = "git-worktree-prune"
diagnostic = true

