[package]
name = "athermemguard"
version = "0.2.3"
edition = "2021"
description = "Memory manager that keeps a Windows PC primed for agentic Unreal Engine work"
build = "build.rs"

[lib]
name = "athermemguard"
path = "src/lib.rs"

[[bin]]
name = "memguard"
path = "src/bin/memguard.rs"

[[bin]]
name = "AtherMemGuard"
path = "src/bin/tray.rs"

[[test]]
name = "update_flow"
path = "tests/update_flow.rs"
harness = false

[features]
# Release builds: AtherMemGuard.exe carries memguard.exe (path in the MEMGUARD_CLI env var)
# and writes it on install and after an update. package.ps1 sets this up.
embed-cli = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
winreg = "0.52"
sha2 = "0.10"

[build-dependencies]
winresource = "0.1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
