[package]
name = "athermemguard"
version = "0.3.0"
edition = "2021"
description = "Memory manager that keeps a Windows PC primed for agentic Unreal Engine work"
build = "build.rs"

[lib]
name = "athermemguard"
path = "src/lib.rs"

[[bin]]
name = "memguard"
path = "src/bin/memguard.rs"

[[bin]]
name = "AtherMemGuard"
path = "src/bin/tray.rs"
required-features = ["gui"]

[[example]]
name = "ui_demo"
path = "examples/ui_demo.rs"
required-features = ["ui-snapshots"]

[[example]]
name = "ui_snapshots"
path = "examples/ui_snapshots.rs"
required-features = ["ui-snapshots"]

[[test]]
name = "tray_doctor"
path = "tests/tray_doctor.rs"
required-features = ["gui"]

[[test]]
name = "update_flow"
path = "tests/update_flow.rs"
harness = false
required-features = ["gui"]

[features]
default = ["gui"]
gui = []
ui-snapshots = ["gui"]
# Release builds: AtherMemGuard.exe carries memguard.exe (path in the MEMGUARD_CLI env var,
# compressed into OUT_DIR by build.rs) and writes it on install and after an update.
embed-cli = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage"] }
sha2 = "0.10"

[build-dependencies]
winresource = "0.1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
