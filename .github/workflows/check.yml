# Builds and tests on GitHub's Windows runner for every push and pull request. Nothing is published.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Anything that reads settings or writes a log uses this folder, never the runner's profile.
      ATHER_MEMGUARD_DIR: ${{ github.workspace }}\target\test-home
      # The runner is throwaway, so the doctor test that writes a test value to HKCU runs here.
      MEMGUARD_TEST_HKCU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: pwsh
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Build (default gui)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-D warnings'
          cargo build --locked
      - name: Feature matrix (--no-default-features & ui-snapshots)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-D warnings'
          cargo build --locked --no-default-features --bin memguard
          cargo test --locked --no-default-features --lib --tests
          cargo build --locked --features ui-snapshots --all-targets --examples
      - name: Test (default gui)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-D warnings'
          cargo test --locked
      - name: Release build (portable + embedded CLI)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-D warnings'
          cargo build --release --locked --no-default-features --bin memguard
          cargo build --release --locked --bin AtherMemGuard
          New-Item -ItemType Directory -Force target\embed | Out-Null
          Copy-Item target\release\memguard.exe target\embed\memguard.exe
          $env:MEMGUARD_CLI = "$PWD\target\embed\memguard.exe"
          cargo build --release --locked --features gui,embed-cli --bin AtherMemGuard
